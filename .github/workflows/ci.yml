name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build, end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/ntfy-admin .

      - name: JS syntax
        run: node --check web/app.js

      - name: Start ntfy + both panels
        run: |
          docker compose -f test/compose.yml up -d --build
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/v1/health && break; sleep 1; done
          docker compose -f test/compose.yml exec -T ntfy sh -c 'NTFY_PASSWORD=adminpass123 ntfy user add --role=admin admin'

      - name: End-to-end tests
        run: test/e2e.sh

      - name: Logs on failure
        if: failure()
        run: docker compose -f test/compose.yml logs

  image:
    name: Container image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # The Dockerfile cross-compiles Go on the build platform, so no QEMU is needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A v* tag gets a GitHub Release, with that version's section of CHANGELOG.md as notes.
  # Runs after the image is pushed, so the release never points to a missing image.
  release:
    name: GitHub release
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "${TAG#v}" > notes.md
          printf '\nImage: `ghcr.io/%s:%s` (amd64, arm64, armv7)\n' "$GITHUB_REPOSITORY" "${TAG#v}" >> notes.md
          cat notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
